<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form onsubmit="handleSubmit(event)" action="">
        <input type="text" id="name" placeholder="enter ur name">
        <input type="number" id="age" placeholder="enter ur age">
        <input type="text" id="course" placeholder="enter ur course">
        <button>Submit</button>
    </form>
    <div id="card"></div>
    
</body>
</html>
<script>
    

    let handleSubmit=(event)=>{

        event.preventDefault()

        let name=document.getElementById("name").value
        let age=document.getElementById("age").value
        let course=document.getElementById("course").value

        let student={name:name,age:age,course:course}

        document.getElementById("card").innerHTML=`
            <div style="border: 2px black solid; padding: 10px;">
                <h3>Student Card</h3>
                <p>${student.name}</p>
                <p>${student.age}</p>
                <p>${student.course}</p>
            </div>
        `


    }

</script>
