<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

     <div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Student Login</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">
            

            <input
              type="email"
              id="email"
              class="form-control mb-3"
              placeholder="Enter Email"
              required
            >

            <input
              type="password"
              id="password"
              class="form-control mb-3"
              placeholder="Enter password"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>
    
</body>
</html>
<script>
  let handleSubmit=(event)=>{
    event.preventDefault() //to stop autorefreshing of browser

    let email=document.getElementById("email")
    let password=document.getElementById("password")
    // get request for checking user exists or not
    let users_data=JSON.parse(localStorage.getItem("users"))
    // console.log(users_data)

    let user=users_data.find((el)=>el.useremail==email.value)
    console.log("matched user",user)
    // filter => returns matching array of objects
    // find =>returns single matching objects----first occurrence

    if(user && user.userpassword==password.value){
      localStorage.setItem("current_user",JSON.stringify(user))
      localStorage.setItem("isLoggedIn","true")
      window.location.href="products.html"
      // alert("user logged in successfully")
    }else{
      alert("Invalid Credentials")
    }
    
  }

// signup ==> user registration
// login ==> backend verifies user wheather she is present in database or not ===> token
// token ==> user information stored
</script>
