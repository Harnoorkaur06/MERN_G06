<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

    </style>
</head>
<body>
    <div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Student Registration</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">
            <input
              type="text"
              id="name"
              class="form-control mb-3"
              placeholder="Enter Name"
              required
            >

            <input
              type="email"
              id="email"
              class="form-control mb-3"
              placeholder="Enter Email"
              required
            >

            <input
              type="password"
              id="password"
              class="form-control mb-3"
              placeholder="Enter password"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="col-md-5 mt-4 mt-md-0">
      <div id="output"></div>
    </div>

  </div>
</div>

</body>
</html>
<script>

    let handleSubmit=(event)=>{
        event.preventDefault() //to stop autorefreshing of browser

        let array=[]
        let name=document.getElementById("name")
        let email=document.getElementById("email")
        let password=document.getElementById("password")

        let user={
            username:name.value,
            useremail:email.value,
            userpassword:password.value
        }
        // console.log(user)
        // array.push(user)
        let check_data=localStorage.getItem("users")
        console.log(check_data)
        if(check_data==null){
            array=[]
        }
        else{
            array=JSON.parse(check_data)
        }
        // some method -->returs boolean value acc to specified condition
        let check_user = array.some((el) => {
            return el.useremail === email.value;
        });
        if (check_user) {
          alert("User already exists");
          return;
            
        }
        array.push(user);

        let storage=localStorage.setItem("users",JSON.stringify(array))

        window.location.href="login.html"
    }
</script>
